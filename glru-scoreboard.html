<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laerskool Fairland Rugby</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1e;
      color: #e8e8f0;
      font-family: 'DM Sans', sans-serif;
      text-align: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(180,180,200,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(120,120,160,0.05) 0%, transparent 60%);
    }

    .logo {
      width: min(180px, 45vw);
      margin-bottom: 2rem;
      filter: drop-shadow(0 2px 18px rgba(200,200,220,0.18));
      opacity: 0.95;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      letter-spacing: 0.06em;
      background: linear-gradient(160deg, #ffffff 0%, #c8c8d8 30%, #8a8aaa 55%, #d0d0e0 75%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.05;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 1px 6px rgba(255,255,255,0.12));
    }

    .subtitle {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #9090b0;
      margin-bottom: 2.5rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card {
      background: linear-gradient(145deg, #26262e 0%, #1e1e26 50%, #222228 100%);
      border: 1px solid transparent;
      border-radius: 1rem;
      padding: 2rem 2.5rem;
      max-width: 480px;
      width: 100%;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 4px 32px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #d0d0e0 0%, #9090b0 40%, #c8c8d8 70%, #e8e8f0 100%);
      color: #1a1a22;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      padding: 0.3rem 1.1rem;
      border-radius: 2rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.5);
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #a0a0c0;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #444460;
    }
  </style>
</head>
<body>
  <img src="1780310267995_Skool_Logo.png" alt="Laerskool Fairland Logo" class="logo" />

  <h1>Laerskool Fairland</h1>
  <div class="subtitle">Rugby Scoreboard</div>

  <div class="card">
    <div class="badge">Season Ended</div>
    <p>
      The 2026 rugby season has come to an end.<br />
      This scoreboard will be back when the new season kicks off.<br /><br />
      Thank you to all the players, coaches, and supporters!
    </p>
  </div>

  <div class="footer">© 2026 Laerskool Fairland &mdash; See you next season</div>
</body>
</html>
