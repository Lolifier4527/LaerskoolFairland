<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laerskool Fairland Rugby</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1a0f;
      color: #e0f0e0;
      font-family: 'DM Sans', sans-serif;
      text-align: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(80,160,80,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(40,120,40,0.05) 0%, transparent 60%);
    }

    .logo {
      width: min(180px, 45vw);
      margin-bottom: 2rem;
      filter: drop-shadow(0 2px 18px rgba(100,200,100,0.18));
      opacity: 0.95;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      letter-spacing: 0.06em;
      background: linear-gradient(160deg, #c8f0c8 0%, #7acc7a 30%, #3a8a3a 55%, #88cc88 75%, #e0ffe0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.05;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 1px 6px rgba(100,200,100,0.15));
    }

    .subtitle {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #5a8a5a;
      margin-bottom: 2.5rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card {
      background: linear-gradient(145deg, #162818 0%, #101e12 50%, #141e15 100%);
      border-radius: 1rem;
      padding: 2rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow:
        0 0 0 1px rgba(100,200,100,0.1),
        0 4px 32px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(150,255,150,0.07);
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #a0d8a0 0%, #4a8a4a 40%, #88cc88 70%, #c8f0c8 100%);
      color: #0d1a0f;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      padding: 0.3rem 1.1rem;
      border-radius: 2rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #7aaa7a;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #2a4a2a;
    }
  </style>
</head>
<body>
  <img src="1780310267995_Skool_Logo.png" alt="Laerskool Fairland Logo" class="logo" />

  <h1>Laerskool Fairland</h1>
  <div class="subtitle">Rugby Scoreboard</div>

  <div class="card">
    <div class="badge">Season Ended</div>
    <p>
      The 2026 rugby season has come to an end.<br />
      This scoreboard will be back when the new season kicks off.<br /><br />
      Thank you to all the players, coaches, and supporters!
    </p>
  </div>

  <div class="footer">© 2026 Laerskool Fairland &mdash; See you next season</div>
</body>
</html>
