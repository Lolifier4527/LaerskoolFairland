<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laerskool Fairland Rugby</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1f0f;
      color: #f5f0e0;
      font-family: 'DM Sans', sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: min(180px, 45vw);
      margin-bottom: 2rem;
      opacity: 0.92;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      letter-spacing: 0.04em;
      color: #d4aa30;
      line-height: 1.05;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #a8bfa8;
      margin-bottom: 2.5rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .card {
      background: #162918;
      border: 1px solid #2a4a2e;
      border-radius: 1rem;
      padding: 2rem 2.5rem;
      max-width: 480px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      background: #d4aa30;
      color: #0d1f0f;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #c8d8c8;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #4a6a4e;
    }
  </style>
</head>
<body>
  <img src="1780310267995_Skool_Logo.png" alt="Laerskool Fairland Logo" class="logo" />

  <h1>Laerskool Fairland</h1>
  <div class="subtitle">Rugby Scoreboard</div>

  <div class="card">
    <div class="badge">Season Ended</div>
    <p>
      The 2025 rugby season has come to an end.<br />
      This scoreboard will be back when the new season kicks off.<br /><br />
      Thank you to all the players, coaches, and supporters!
    </p>
  </div>

  <div class="footer">© 2025 Laerskool Fairland &mdash; See you next season</div>
</body>
</html>
